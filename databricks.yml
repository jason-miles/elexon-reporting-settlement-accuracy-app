# Databricks Asset Bundles (DABS) - Elexon Consumption Insights
# Standalone bundle — no GitHub required. Share this folder with customers.
# Deploy from CLI: databricks bundle deploy -t dev
# Or from Databricks: open this folder in Workspace/Repos, open databricks.yml, click Deployments (rocket)
# See: https://docs.databricks.com/en/dev-tools/bundles/
# Customer deployment: see docs/CUSTOMER_SETUP.md

bundle:
  name: elexon-consumption-insights

variables:
  catalog_name:
    description: Unity Catalog name for Elexon data
    default: elexon_app_for_settlement_acc_catalog

include:
  - resources/*.yml

targets:
  dev:
    default: true
    mode: development
    workspace:
      host: https://fevm-elexon-app-for-settlement-acc.cloud.databricks.com
  prod:
    mode: production
    workspace:
      host: https://fevm-elexon-app-for-settlement-acc.cloud.databricks.com
