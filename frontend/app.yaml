# Databricks App config for Consumption Insights & Anomaly Detection
# FastAPI backend serves the pre-built React frontend (dist/) AND the
# /api/reports store (Unity Catalog gold.case_reports). Python deps install
# from requirements.txt.
#
# The SPA is built LOCALLY (npm run build) and dist/ is shipped with the sync
# (deploy.sh uses --include 'dist/**'), so the runtime launches uvicorn only —
# no npm install on the server (which is slow and flaky).
command:
  - "uvicorn"
  - "main:app"
  - "--host"
  - "0.0.0.0"
  - "--port"
  - "$DATABRICKS_APP_PORT"

env:
  - name: ELEXON_CATALOG
    value: "elexon_app_for_settlement_acc_catalog"
  - name: ELEXON_SCHEMA
    value: "gold"
  - name: DATABRICKS_WAREHOUSE_ID
    value: "d0305022e6c3db8e"
